<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Card Preview - {{ card.name_en }}</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h2 {
      color: #2c3e50;
      margin-bottom: 20px;
    }

    .card-container {
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
    }

    .card {
      width: 420px;
      height: auto;
      border: 2px solid #1abc9c;
      border-radius: 10px;
      background: white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .card img {
      display: block;
      width: 100%;
      height: auto;
    }

    .back-link {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 20px;
      background: #1abc9c;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: background 0.3s;
    }

    .back-link:hover {
      background: #16a085;
    }

    @media screen and (max-width: 950px) {
      .card-container {
        flex-direction: column;
        align-items: center;
      }
      .card {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <h2>Preview of {{ card.name_en }}</h2>

  <div class="card-container">
    <!-- Front Side -->
    <div class="card">
      <img src="data:image/jpeg;base64,{{ front_img }}" alt="Front Side">
    </div>

    <!-- Back Side -->
    <div class="card">
      <img src="data:image/jpeg;base64,{{ back_img }}" alt="Back Side">
    </div>
  </div>

  <a href="{{ url_for('cards') }}" class="back-link">Back to Cards</a>

</body>
</html>
