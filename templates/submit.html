<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Farmer ID Card Generator</title>
</head>
<body>
    <h2>Farmer ID Card Generator</h2>
    <form action="{{ url_for('submit_card') }}" method="POST" enctype="multipart/form-data">
        <input type="text" name="name_en" placeholder="Name in English" required><br><br>
        <input type="text" name="name_mr" placeholder="Name in Marathi" required><br><br>
        <input type="date" name="dob" placeholder="Date of Birth" required><br><br>
        <select name="gender" required>
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select><br><br>
        <input type="text" name="mobile" placeholder="Mobile Number" required><br><br>
        <input type="text" name="aadhaar" placeholder="Aadhaar Number" required><br><br>
        <input type="text" name="farmer_id" placeholder="Farmer ID" required><br><br>
        <input type="text" name="address_en" placeholder="Address in English" required><br><br>
        <input type="text" name="address_mr" placeholder="Address in Marathi" required><br><br>
        <button type="submit">Submit & Generate Card</button>
    </form>
</body>
</html>
