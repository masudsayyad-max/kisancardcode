<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign In</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .card{width:360px;background:#fff;padding:24px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,0.08)}
    .logo{font-weight:800;color:#2c7a7b;text-align:center;margin-bottom:14px}
    .tabs{display:flex;justify-content:center;gap:12px;margin-bottom:18px}
    .tabs a{color:#666;text-decoration:none;font-weight:600}
    .tabs a.active{color:#2c7a7b}
    label{display:block;font-size:13px;color:#333;margin-top:8px;margin-bottom:6px}
    input{width:100%;padding:10px;border:1px solid #d7dfe6;border-radius:8px;font-size:14px}
    button{width:100%;margin-top:16px;background:#2c7a7b;color:#fff;border:none;padding:11px;border-radius:8px;font-weight:700;cursor:pointer}
    .small{font-size:13px;margin-top:10px;text-align:center}
    .small a{color:#2c7a7b;text-decoration:none}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">AgriStack Logo</div>

    <div class="tabs">
      <!-- FIXED: should point to 'login', not 'login_page' -->
      <a href="{{ url_for('login') }}" class="active">Sign In</a>
      <a href="{{ url_for('signup') }}">Sign Up</a>
    </div>

    <!-- IMPORTANT: form posts to login route -->
    <form method="POST" action="{{ url_for('login') }}">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="Email" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Password" required>

      <button type="submit">Sign In</button>
    </form>

    <div class="small">
      <a href="{{ url_for('signup') }}">Forgot password?</a>
    </div>
  </div>
</body>
</html>
